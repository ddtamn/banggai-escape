<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#18342a" />
		<!--
			Plus Jakarta Sans is self-hosted as a variable font; the `@font-face` rules are
			imported in `+layout.svelte`. It used to come from Google Fonts as seven separate
			weight files across two origins, which meant a DNS lookup, a TLS handshake and a
			third-party connection before the first glyph could paint. One variable file covers
			all six weights the site uses, same origin as the CSS that declares it, and Vite
			bundles it rather than fetching it at runtime.

			No manual preload: the `@font-face` lives in this app's own stylesheet, so the font
			is discovered at the same moment as the render-blocking CSS, and
			`font-display: swap` covers the gap. A preload would buy nothing now that there is
			no third-party handshake to hide.
		-->
		<!--
			Icons are inline SVG, rendered by `$lib/components/Icon.svelte` from the generated
			`$lib/icons`. Font Awesome used to be a cdnjs stylesheet, and it was the last
			render-blocking third-party origin on the site: 17 KB of CSS plus three icon fonts
			weighing 293 KB, to draw 35 glyphs. The database still stores the same `fa-*` class
			strings an editor picks in the admin, so no stored data changed.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
